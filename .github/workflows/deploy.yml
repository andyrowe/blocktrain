name: Deploy site to Cloudflare Pages

# Auto-deploys the static site whenever site/ changes on master. The Cloudflare API
# token lives as a repo secret (set by the owner), so no credential is stored anywhere
# else. Manual runs available via the "Run workflow" button (workflow_dispatch).
on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build version into the page
        run: |
          SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%d)
          LINK="<a href=\"https://github.com/andyrowe/blocktrain/commit/${GITHUB_SHA}\">${SHA}</a> · ${DATE}"
          sed -i "s|__BUILD__|${LINK}|" site/index.html
          echo "stamped build ${SHA} · ${DATE}"
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.128.0"
          # Workers static-assets deploy (config in wrangler.jsonc). The site serves from a
          # Worker (sparkling-shadow-3990), not a Pages project, so this is `deploy`, not `pages deploy`.
          command: deploy
